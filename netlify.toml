[build]
  # 依赖安装完成后，仅剔除 sharp 原生图像包（本站 images.unoptimized、无 next/image，不做图片优化）；
  # 必须保留 @next/swc、lightningcss 等其余构建期可选依赖，不能用全局 omit=optional。
  command = "rm -rf node_modules/sharp node_modules/@img && npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  node_bundler = "esbuild"
  included_files = [
    "!.git/**",
    "!public/**",
    "!node_modules/typescript/**",
    "!node_modules/caniuse-lite/**",
    "!node_modules/sharp/**",
    "!node_modules/@img/**",
  ]
